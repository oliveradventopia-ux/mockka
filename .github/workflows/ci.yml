name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm typecheck
      - run: pnpm test
      - name: blind-exploit scan
        run: node tools/exploit-scan.mjs
      - name: Stellar harness gate
        run: node builder/index/index_check.mjs && node builder/engine/scripts/harness_drift_check.mjs && node builder/engine/scripts/control_byte_check.mjs && (cd builder && node --test)
      - run: pnpm build

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
